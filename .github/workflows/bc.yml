on:
  pull_request: ~
  push:
    branches:
      - "master"

name: Roave

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  roave_bc_check:
    name: BC Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Roave BC Check
        uses: docker://nyholm/roave-bc-check-ga
        with:
          args: --install-development-dependencies
        env:
          # The runner's HOME override hides the image's safe.directory config.
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: safe.directory
          GIT_CONFIG_VALUE_0: /github/workspace
